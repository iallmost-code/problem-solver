function launch(d){d.ph='run';const r=d.rt;let pn;
  if(d.foul){pn=25;d.lbl='RED LIGHT';sfx.red();if(++S.reds>=3)unlock('redlight')}else if(r<.12){pn=0;d.lbl='PERFECT LIGHT';sfx.good()}else if(r<.25){pn=3;d.lbl='GOOD LIGHT'}else if(r<.45){pn=8;d.lbl='SLEEPY'}else{pn=15;d.lbl='ASLEEP AT THE TREE'}
  d.pen+=pn;d.lblT=1.2}
function doShift(d,l,pn){d.shifts.push(l);d.pen+=pn;d.spen+=pn;d.gear++;d.rpm=.45;d.bounce=0;d.lbl=l;d.lblT=.9;pn?sfx.shift():sfx.good()}
function updDrag(dt){const d=D;d.t+=dt;d.lblT=Math.max(0,d.lblT-dt);
  if(d.ph==='pre'){if(pressed){d.ph='tree';d.t=0;sfx.click()}}
  else if(d.ph==='tree'){const gt=d.delay+1.5,n=d.t>=gt?4:d.t>=d.delay+1?3:d.t>=d.delay+.5?2:d.t>=d.delay?1:0;
    if(n>d.lit){d.lit=n;n===4?sfx.green():sfx.amber()}

  else if(d.ph==='run'){d.v=Math.min(1,d.v+dt*.35);d.x+=d.v*dt*900;
    if(d.gear<=3){const dur=[1.5,1.9,2.3][d.gear-1];

      else{d.rpm+=dt*.7/dur;if(d.rpm>=1){d.rpm=1;d.bounce=.5}
        if(pressed){const r=d.rpm;if(r>=.82&&r<=.94)doShift(d,'PERFECT',0);else if(r<.82)doShift(d,'EARLY',r<.6?10:5);else doShift(d,'LATE',5)}}}
    else{d.fin+=dt;if(d.fin>1){d.ph='slip';d.st=0;d.drive=Math.max(5,15+d.pen-4*U.tires);d.perfect=d.pen===0;
      if(d.race){d.you=Math.max(d.rt,0)+11.5+d.spen*.05;d.win=!d.foul&&d.you<11.5+d.rv;
        if(d.win){const r=[100,150,250][S.strip.round];gain(r);S.strip.rep+=r;S.strip.wins++;S.stripWins++;sfx.win();confetti(W/2,H*.3,50)}else sfx.lose()}
      else if(d.perfect){S.perfects++;gain(50);sfx.win();unlock('perfect');confetti(W/2,H*.3,40)}}}}
  else if(d.ph==='slip'){d.st+=dt;if(pressed&&d.st>.5){if(d.race){if(d.win&&++S.strip.round<3)nextRace();else endStrip()}else{S.min+=d.drive;if(S.min>=600)endDay(true);else startJob()}}}
}

function startGame(){S.scene='game';G={t:45,x:W/2,y:H/2,hp:3,inv:0,b:[],e:[],pt:[],k:0,rep:0,sp:.5,ft:0,aim:0,over:0,win:false}}

function updGame(dt){const q=G;for(let i=q.pt.length-1;i>=0;i--){const o=q.pt[i];o.x+=o.vx*dt;o.y+=o.vy*dt;o.l-=dt;if(o.l<=0)q.pt.splice(i,1)}
  if(q.over){q.over+=dt;if(q.over>1.8)endGame();return}
  q.t-=dt;q.inv=Math.max(0,q.inv-dt);const dif=day().diff;
  let vx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),vy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(touch&&down){const dx=mx-q.x,dy=my-q.y,d=Math.hypot(dx,dy);if(d>14){vx=dx/d;vy=dy/d}}
  const l=Math.hypot(vx,vy)||1;q.x=clamp(q.x+vx/l*270*dt,14,W-14);q.y=clamp(q.y+vy/l*270*dt,66,H-14);
  let near=null,nd=1e9;for(const e of q.e){const d=Math.hypot(e.x-q.x,e.y-q.y);if(d<nd){nd=d;near=e}}
  if(touch){if(near)q.aim=Math.atan2(near.y-q.y,near.x-q.x)}else q.aim=Math.atan2(my-q.y,mx-q.x);
  q.ft-=dt;if(q.ft<=0&&(!touch||near)){q.ft=.13;q.b.push({x:q.x,y:q.y,vx:Math.cos(q.aim)*720,vy:Math.sin(q.aim)*720,l:1});tone('square',600,220,.05,.012)}
  q.sp-=dt;if(q.sp<=0){q.sp=Math.max(.2,.85-dif*.035-(45-q.t)*.008);const sd=ri(4),big=Math.random()<.15;
    q.e.push({x:sd===0?-20:sd===1?W+20:rnd(0,W),y:sd===2?46:sd===3?H+20:rnd(60,H),hp:big?4:1,r:big?18:11,big,v:(big?55:85)+dif*6+rnd(0,25),fl:0})}
  for(let i=q.b.length-1;i>=0;i--){const b=q.b[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;let gone=b.l<=0||b.x<0||b.x>W||b.y<50||b.y>H;
    if(!gone)for(const e of q.e){if(e.hp>0&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){e.hp--;e.fl=.08;gone=true;
      if(e.hp<=0){q.k++;const r=e.big?15:5;q.rep+=r;gain(r);for(let k=0;k<10;k++){const a=rnd(0,TAU),v=rnd(60,260);q.pt.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.2,.5)})}}break}}
    if(gone)q.b.splice(i,1)}
  for(let i=q.e.length-1;i>=0;i--){const e=q.e[i];if(e.hp<=0){q.e.splice(i,1);continue}e.fl=Math.max(0,e.fl-dt);const dx=q.x-e.x,dy=q.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.v*dt;e.y+=dy/d*e.v*dt;
    if(d<e.r+12&&q.inv<=0){q.hp--;q.inv=1.1;sfx.red();if(q.hp<=0){q.over=.01;q.win=false;sfx.lose();return}}}
  if(q.t<=0){q.t=0;q.win=true;q.over=.01;const r=150+dif*30;q.rep+=r;gain(r);S.extracts++;sfx.win();unlock('extract');confetti(W/2,H/2,80)}}
function drawGame(){const q=G;g.fillStyle='#080c14';g.fillRect(0,0,W,H);g.strokeStyle='rgba(79,227,255,.08)';g.lineWidth=1;g.beginPath();

  g.fillStyle='#1b2026';g.fillRect(0,gy,W,H-gy);g.fillStyle='#f2d14b';for(let x=20;x<W;x+=140)g.fillRect(x,gy+(H-gy)*.6,70,5);truck(W*.2,gy+52,Math.min(1.7,W/460))}
function camp(){const sk=g.createLinearGradient(0,0,0,H);sk.addColorStop(0,'#050a18');sk.addColorStop(1,'#111d33');g.fillStyle=sk;g.fillRect(0,0,W,H);
  for(let i=0;i<140;i++){const hx=Math.sin(i*12.9898)*43758.5453,hy=Math.sin(i*78.233)*12543.137,x=(hx-Math.floor(hx))*W,y=(hy-Math.floor(hy))*H*.6;g.globalAlpha=.4+.6*Math.abs(Math.sin(T*.8+i));g.fillStyle='#fff';g.fillRect(x,y,i%7?1.4:2.4,i%7?1.4:2.4)}g.globalAlpha=1;
  const mnx=W>900?W*.46:W*.8;g.fillStyle='#f3f0df';g.beginPath();g.arc(mnx,H*.16,26,0,TAU);g.fill();g.fillStyle='#07101f';g.beginPath();g.arc(mnx+11,H*.16-5,23,0,TAU);g.fill();
  if(star>0){star-=1/60;const q=1-star/1.4;g.strokeStyle='rgba(255,255,255,'+(1-q)+')';g.lineWidth=3;g.beginPath();g.moveTo(W*(.1+q*.5),H*(.08+q*.2));g.lineTo(W*(.1+q*.5)-90,H*(.08+q*.2)-36);g.stroke()}
  const gy=H*.62;g.fillStyle='#07100c';g.beginPath();g.moveTo(0,gy);for(let x=0;x<=W;x+=24)g.lineTo(x,gy-30-(x*37%50)-Math.sin(x*.02)*20);g.lineTo(W,gy);g.fill();g.fillRect(0,gy,W,H-gy);
  const tx=W>900?W*.16:W*.3,ty=gy+40;g.fillStyle='#24384a';g.beginPath();g.moveTo(tx-90,ty);g.lineTo(tx,ty-90);g.lineTo(tx+90,ty);g.fill();g.fillStyle='#0d1822';g.beginPath();g.moveTo(tx-18,ty);g.lineTo(tx,ty-52);g.lineTo(tx+18,ty);g.fill();
  const fx=campFire()[0],fy=gy+46,gl=g.createRadialGradient(fx,fy,4,fx,fy,190);gl.addColorStop(0,'rgba(255,150,50,.45)');gl.addColorStop(1,'rgba(255,150,50,0)');g.fillStyle=gl;g.fillRect(fx-200,fy-200,400,400);
  g.strokeStyle='#3a2414';g.lineWidth=9;g.lineCap='round';g.beginPath();g.moveTo(fx-30,fy+6);g.lineTo(fx+30,fy-4);g.moveTo(fx-30,fy-4);g.lineTo(fx+30,fy+6);g.stroke();g.lineCap='butt';
  for(let i=0;i<5;i++){const a=T*6+i*1.7,h=34+Math.sin(a)*12-i*4;g.fillStyle=['#ff5a1f','#ff8a1f','#ffb13d','#ffd84a','#fff3b0'][i];g.beginPath();g.moveTo(fx-20+i*4,fy);g.quadraticCurveTo(fx+Math.sin(a*.7)*10,fy-h*1.7,fx+20-i*4,fy);g.fill()}

function hud(){const d=day();g.fillStyle='rgba(6,9,13,.85)';g.fillRect(0,0,W,48);g.fillStyle='#ff8a1f';g.fillRect(0,48,W,2);g.textBaseline='middle';

  g.textAlign='center';g.font=F0(22);g.fillStyle=S.min>510?'#ff5468':'#eef3f7';g.fillText(S.scene==='fish'?Math.ceil(F.t)+'s  ·  '+F.total.toFixed(1)+' / '+F.limit+' LB':S.scene==='game'?Math.ceil(G.t)+'s  ·  '+G.k+' KILLS':S.scene==='micro'&&M.lbl?M.lbl:S.scene==='drag'&&D.race?'ROUND '+(S.strip.round+1)+' OF 3':clockStr(S.min),W/2,25);

/* ---------- input / loop ---------- */
window.addEventListener('keydown',e=>{if(paused)return;const k=e.key.toLowerCase();if(k===' '||k==='enter'){e.preventDefault();if(dlgOpen){if(!e.repeat)closeDlg();return}if(!e.repeat){down=true;pressed=true}}
  if(k==='m'){muted=!muted;saveSettings()}if(k==='h'&&S.scene==='puzzle'&&!dlgOpen)smack()});

let last=0;
