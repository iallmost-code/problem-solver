function spatialNormalize(cells) {

}
function spatialShape(v,id,turn) {
  let cells = [];
  v.map.forEach((row,y) => Array.from(row).forEach((letter,x) => {
    if (letter === String.fromCharCode(65+id)) cells.push([x,y]);
  }));

  for (let i=0; i<(turn+id+1)%4; i++) cells = spatialNormalize(cells.map(([x,y]) => [-y,x]));
  return cells;
}

// The shop's four-key locker allows repeated digits and scores duplicate keys once.
function psDedScore(code, guess) {
  const seated = code.filter((digit, i) => digit === guess[i]).length;
  const shared = [0, 1, 2, 3].reduce((total, digit) => total +
    Math.min(code.filter(n => n === digit).length, guess.filter(n => n === digit).length), 0);
  return [seated, shared - seated];
}

function psRecordHolds(rule,rows){
  const [type,a,b]=rule;
  const x=rows.findIndex(row=>row.includes(a)),y=rows.findIndex(row=>row.includes(b));
  if(type==='same')return x===y;
  if(type==='diff')return x!==y;
  if(type==='before')return x<y;
  if(type==='apart')return Math.abs(x-y)===2;
  return x+1===y;
}

  if(!paused&&!dlgOpen){if(S.scene==='drag')updDrag(dt);else if(S.scene==='puzzle')updPuzzle(dt);else if(S.scene==='fish')updFish(dt);else if(S.scene==='game')updGame(dt);else if(S.scene==='micro')updMicro(dt)}
  if(!paused&&S.scene==='weekend'&&click&&Math.hypot(click.x-(W>900?W*.46:W*.8),click.y-H*.16)<50&&++S.moon===3){star=1.4;unlock('wish');toast('The moon heard you. It is thinking about it.')}
  pressed=false;click=null;
  g.setTransform(DPR,0,0,DPR,0,0);
  const deskCover=caseIsOpen()||['title','arcade','skitgallery'].includes(S.scene);
  if(deskCover){$('rotatePanel').hidden=true;$('pauseButton').hidden=arcadeMode||!caseIsOpen();requestAnimationFrame(frame);return}
  const cramped=S.scene==='micro'&&M&&GAME_CATEGORIES[M.kind]&&H<500;
  $('rotatePanel').hidden=!cramped;if(cramped&&!paused)pauseGame();
  if(S.scene==='drag'&&D){drawDrag();hud()}else if(S.scene==='puzzle'&&P){drawPuzzle();hud()}else if((S.scene==='fish'||S.scene==='fishend')&&F){drawFish();if(S.scene==='fish')hud()}
  else if((S.scene==='game'||S.scene==='gameend')&&G){drawGame();if(S.scene==='game')hud()}
  else if(S.scene==='micro'&&M){drawMicro();hud()}
  else if(S.scene==='weekend')camp();else if(['title','arcade','skitgallery','skit','ach'].includes(S.scene))depot();else backdrop();
  drawFX(paused?0:dt);
  $('pauseButton').hidden=['title','ach','arcade','skitgallery'].includes(S.scene);
  if(!paused){saveElapsed+=dt;if(saveElapsed>=.5){saveElapsed=0;save()}}
  requestAnimationFrame(frame)}
const CALLBACKS={skitNext,skitGallery,arcadeScreen,startDrag,radio,afterEvening,startFish,startStrip,startGame,startGarage,weekendStats,title};

window.addEventListener('pagehide',save);
ready=true;title();

if(linkedDay&&validCaseDay(linkedDay[1]))beginDaily(linkedDay[1]);
