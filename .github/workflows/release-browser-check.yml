name: Verify the 3:59 Edition in Chromium
on:
  push:
    branches: [qa/359-browser-check]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: node --test test-expansion.cjs test-callback.cjs
      - run: python -m pip install playwright==1.55.0
      - name: Play all 18 tickets with desktop and touch controls
        run: |
          python -m http.server 8790 --bind 127.0.0.1 > /tmp/game-http.log 2>&1 &
          CASE_GAME_URL=http://127.0.0.1:8790/ python tests/play_cases.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-screenshots
          path: screenshots/
