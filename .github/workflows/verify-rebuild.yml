name: Verify animated arcade rebuild
on:
  push:
    branches: [qa/animated-arcade-20261112]
permissions:
  contents: read
jobs:
  arcade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/rules.cjs
      - run: python -m pip install playwright==1.55.0
      - name: Play all eight games on desktop and phone
        run: |
          python -m http.server 8790 --bind 127.0.0.1 > /tmp/arcade-server.log 2>&1 &
          python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animated-gameplay-screenshots
          path: screenshots/
